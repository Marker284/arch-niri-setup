# ═══════════════════════════════════════════════════════════════════════════
#  kitty — терминал
#  Цвета подтягиваются из палитры Noctalia (см. include в самом низу файла;
#  строку добавляет и обновляет сам Noctalia — не удаляй её).
#  Перезагрузка конфига на лету:  Ctrl+Shift+F5
# ═══════════════════════════════════════════════════════════════════════════

# ── Шрифт ──────────────────────────────────────────────────────────────────
font_family              JetBrainsMono Nerd Font
bold_font                JetBrainsMono Nerd Font SemiBold
italic_font              auto
bold_italic_font         auto
font_size                11.5
disable_ligatures        never

# ── Окно ───────────────────────────────────────────────────────────────────
window_padding_width     12
hide_window_decorations  yes
remember_window_size     no
initial_window_width     110c
initial_window_height    30c
confirm_os_window_close  0
background_opacity       0.90
dynamic_background_opacity yes

# ── Курсор ─────────────────────────────────────────────────────────────────
cursor_shape             beam
cursor_beam_thickness    1.8
cursor_blink_interval    0.6
# Курсор плавно догоняет текст при наборе (1 = след на каждое движение).
cursor_trail             1
cursor_trail_decay       0.08 0.25
cursor_trail_start_threshold 0

# ── Прокрутка ──────────────────────────────────────────────────────────────
scrollback_lines         20000
wheel_scroll_multiplier  4.0
touch_scroll_multiplier  2.0

# ── Вкладки ────────────────────────────────────────────────────────────────
tab_bar_edge             top
tab_bar_style            powerline
tab_powerline_style      slanted
tab_bar_min_tabs         2
tab_title_template       "{index}: {title}"

# ── Разное ─────────────────────────────────────────────────────────────────
enable_audio_bell        no
visual_bell_duration     0.0
window_alert_on_bell     yes
allow_remote_control     yes
listen_on                unix:@mykitty
update_check_interval    0
shell_integration        enabled
copy_on_select           no
strip_trailing_spaces    smart
url_style                curly
mouse_hide_wait          2.0

# ── Клавиши ────────────────────────────────────────────────────────────────
map ctrl+shift+c         copy_to_clipboard
map ctrl+shift+v         paste_from_clipboard
map ctrl+shift+enter     new_window
map ctrl+shift+t         new_tab
map ctrl+shift+w         close_window
map ctrl+equal           change_font_size all +1.0
map ctrl+minus           change_font_size all -1.0
map ctrl+0               change_font_size all 0
map ctrl+shift+f5        load_config_file

# ── Цвета из Noctalia ──────────────────────────────────────────────────────
# Строка ниже добавляется автоматически при первой генерации палитры:
# include themes/noctalia.conf
include themes/noctalia.conf
